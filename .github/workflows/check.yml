name: Windows build and release check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      # Hosted Windows has a small virtual desktop; large-DPI layout checks run
      # locally with check.ps1 -Ui. The packaged EXE still starts below on CI.
      - name: Build, style and core checks (Windows PowerShell 5.1)
        shell: powershell
        run: .\scripts\check.ps1
      - name: Package and launch the extracted standalone application
        shell: powershell
        run: .\scripts\package-release.ps1 -SkipChecks
      - name: Keep verification reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-verification
          path: |
            qa/**/*.json
            qa/**/*.png
            release/stage-*/startup-checks/**/*.json
            release/stage-*/startup-checks/**/*.png
          retention-days: 14
