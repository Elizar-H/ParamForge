name: Windows build and release check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      QT_OPENGL: software
    steps:
      - uses: actions/checkout@v7
      - name: Set build paths
        shell: powershell
        run: |
          "PARAMFORGE_WORK_ROOT=$env:RUNNER_TEMP\ParamForge" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PARAMFORGE_QT_ROOT=$env:RUNNER_TEMP\Qt\6.12.0\msvc2022_64" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install Qt 6.12 for MSVC 2022 x64
        shell: powershell
        run: |
          python -m pip install aqtinstall==3.3.0
          if ($LASTEXITCODE -ne 0) { throw 'Cannot install aqtinstall.' }
          python -m aqt install-qt windows desktop 6.12.0 win64_msvc2022_64 -O "$env:RUNNER_TEMP\Qt" --archives qtbase qttools opengl32sw d3dcompiler_47
          if ($LASTEXITCODE -ne 0) { throw 'Cannot install Qt.' }
      # All four DPI scales are checked locally; the extracted ZIP also starts on CI.
      - name: Build the development configuration
        shell: powershell
        run: .\scripts\build.ps1 -Configuration Debug -NoDeploy
      - name: Build and core checks (Windows PowerShell 5.1)
        shell: powershell
        run: .\scripts\check.ps1
      - name: Package and launch the extracted standalone application
        shell: powershell
        run: .\scripts\package-release.ps1 -SkipChecks
      - name: Keep verification reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-verification
          path: |
            ${{ runner.temp }}/ParamForge/qa/**
            ${{ runner.temp }}/ParamForge/logs/**
            ${{ runner.temp }}/ParamForge/staging/package-*/startup-checks/**
            ${{ runner.temp }}/ParamForge/packages/*
          retention-days: 14
